<!--
  ILATEK · GHL Custom Code · Barra de navegación transparente (embed independiente)
  Logo + enlaces. Sin fondo: se integra sobre cualquier página de GHL.
  Enlaces de cotización: https://ilatekpr.com/cotizacion
-->
<section id="ilatek-nav" aria-label="Navegación de Ilatek">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Outfit:wght@700;800&display=swap');

    #ilatek-nav{--iln-ink:#11164b;--iln-green:#00b94f;--iln-green-dark:#009640;--iln-line:#dbe2f1;--iln-white:#fff;position:relative;z-index:50;width:100%;background:transparent;color:var(--iln-ink);font-family:Manrope,Arial,sans-serif}#ilatek-nav *{box-sizing:border-box;margin:0;padding:0}#ilatek-nav a{color:inherit;text-decoration:none}#ilatek-nav [hidden]{display:none!important}.iln-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.iln-shell{width:min(100% - 40px,1210px);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:88px}.iln-brand{display:flex;align-items:center;gap:12px;font-family:Outfit,Manrope,sans-serif;font-size:23px;font-weight:800;letter-spacing:-.06em}.iln-brand img{width:49px;height:49px;border:3px solid var(--iln-white);border-radius:50%;object-fit:cover;background:var(--iln-white);box-shadow:0 10px 24px rgba(12,18,70,.15)}.iln-links{display:flex;align-items:center;gap:26px;font-size:13px;font-weight:700}.iln-links a{padding:8px 0}.iln-links a:hover,.iln-links a:focus-visible{color:var(--iln-green-dark)}.iln-menu{display:none}

    @media(max-width:820px){.iln-links{display:none}.iln-menu{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--iln-line);border-radius:9px;background:var(--iln-white);color:var(--iln-ink);font-size:19px;cursor:pointer}.iln-menu[aria-expanded=true]{background:var(--iln-ink);color:#fff}.iln-links.is-open{position:absolute;top:calc(100% + 8px);right:20px;display:grid;gap:4px;min-width:230px;padding:14px;border:1px solid var(--iln-line);border-radius:12px;background:var(--iln-white);box-shadow:0 18px 38px rgba(12,18,70,.14)}.iln-links.is-open a{padding:11px}}
  </style>

  <div class="iln-shell">
    <a class="iln-brand" href="https://ilatekpr.com/" aria-label="Ilatek, inicio"><img src="https://assets.cdn.filesafe.space/8OxUENFVM60EKzqsTcoD/media/6aa1c05dd953a0128b5348c2.jpg" alt="Logo de Ilatek - Servicio de Limpieza en Puerto Rico" title="Ilatek - Servicio de Limpieza en Puerto Rico"><span>Ilatek</span></a>
    <nav class="iln-links" id="iln-links" aria-label="Navegación principal">
      <a href="#ilatek-servicio">Servicios</a>
      <a href="#ilatek-cobertura">Cobertura</a>
      <a href="#ilatek-proceso">Cómo trabajamos</a>
      <a href="https://ilatekpr.com/cotizacion">Cotización</a>
    </nav>
    <button class="iln-menu" type="button" aria-expanded="false" aria-controls="iln-links"><span aria-hidden="true">☰</span><span class="iln-sr">Abrir menú</span></button>
  </div>

  <script>
  (function(){
    var root=document.getElementById('ilatek-nav'); if(!root)return;
    var menu=root.querySelector('.iln-menu'), links=root.querySelector('.iln-links');
    if(menu&&links){
      var setOpen=function(open){links.classList.toggle('is-open',open);menu.setAttribute('aria-expanded',String(open));var sr=menu.querySelector('.iln-sr');if(sr)sr.textContent=open?'Cerrar menú':'Abrir menú'};
      menu.addEventListener('click',function(){setOpen(!links.classList.contains('is-open'))});
      Array.prototype.forEach.call(links.querySelectorAll('a'),function(a){a.addEventListener('click',function(){setOpen(false)})});
      document.addEventListener('click',function(e){if(links.classList.contains('is-open')&&!root.contains(e.target))setOpen(false)});
    }
  })();
  </script>
</section>
