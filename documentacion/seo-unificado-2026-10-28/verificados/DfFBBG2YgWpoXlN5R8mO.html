/* =========================================================
   GHL HERO SECTION — FULL WIDTH PARALLAX
   Target: #section-LUDUIMQI6
   ========================================================= */

#section-LUDUIMQI6 {
    position: relative !important;
    width: 100% !important;
    max-width: 100% !important;
    min-height: 680px !important;
    height: auto !important;
    margin: 0 !important;
    /* NEW HERO IMAGE */
    background-image: url("https://assets.cdn.filesafe.space/8OxUENFVM60EKzqsTcoD/media/2f72232d-7dc2-4f0f-875c-c0eb9fd00bd5.jpg") !important;
    background-size: cover !important;
    background-position: center center !important;
    background-repeat: no-repeat !important;
    /* DESKTOP PARALLAX */
    background-attachment: fixed !important;
    overflow: hidden !important;
}


/* Remove backgrounds from inner GHL rows/columns
   so the image remains visible */

#section-LUDUIMQI6 .row,
#section-LUDUIMQI6 .inner,
#section-LUDUIMQI6 .c-row,
#section-LUDUIMQI6 .c-column {
    background: transparent !important;
    background-color: transparent !important;
}


/* Remove old background overlays */

#section-LUDUIMQI6::before,
#section-LUDUIMQI6::after {
    background-image: none !important;
}


/* =========================================================
   FULL WIDTH — REMOVE GHL SIDE SPACING
   ========================================================= */

#section-LUDUIMQI6 > .inner {
    width: 100% !important;
    max-width: 100% !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 1024px) {

    #section-LUDUIMQI6 {
        width: 100% !important;
        min-height: 600px !important;
        background-size: cover !important;
        background-position: center center !important;
        background-attachment: fixed !important;
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 767px) {

    #section-LUDUIMQI6 {
        width: 100% !important;
        min-height: 0 !important;
        height: auto !important;
        /*
         * Mobile-safe parallax.
         * Fixed backgrounds can glitch on iOS/Android.
         */
        background-attachment: scroll !important;
        background-size: cover !important;
        background-position: center center !important;
        background-repeat: no-repeat !important;
        overflow: hidden !important;
    }

    #section-LUDUIMQI6 > .inner {
        width: 100% !important;
        max-width: 100% !important;
        padding-left: 15px !important;
        padding-right: 15px !important;
    }
}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 480px) {

    #section-LUDUIMQI6 {
        min-height: 0 !important;
        background-position: center center !important;
        background-size: cover !important;
        background-attachment: scroll !important;
    }
}

### If GHL is still showing the old background

GHL sometimes puts the background on a **child element rather than the section itself**. In that case, add this stronger override:

```css
/* FORCE IMAGE THROUGH GHL BACKGROUND LAYERS */

#section-LUDUIMQI6,
#section-LUDUIMQI6 > div,
#section-LUDUIMQI6 .inner {
    background-image: url("https://assets.cdn.filesafe.space/8OxUENFVM60EKzqsTcoD/media/2f72232d-7dc2-4f0f-875c-c0eb9fd00bd5.jpg") !important;
    background-size: cover !important;
    background-position: center center !important;
    background-repeat: no-repeat !important;
}


/* Keep actual content transparent */

#section-LUDUIMQI6 .row,
#section-LUDUIMQI6 .c-row,
#section-LUDUIMQI6 .c-column {
    background-color: transparent !important;
}


/* Mobile */

@media (max-width: 767px) {
    #section-LUDUIMQI6,
    #section-LUDUIMQI6 > div,
    #section-LUDUIMQI6 .inner {
        background-attachment: scroll !important;
        background-size: cover !important;
        background-position: center center !important;
    }
}
```

**I would try the first block first.** If the image still doesn't appear, use the second block because GHL is probably applying the existing background to one of the nested elements.
