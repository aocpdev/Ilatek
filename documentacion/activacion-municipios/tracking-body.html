<!-- Performance head (GoHighLevel) · desktop + mobile -->
<link rel="dns-prefetch" href="https://i.ytimg.com">
<link rel="dns-prefetch" href="https://www.youtube-nocookie.com">
<style>
  img, video, iframe, embed, object { max-width: 100%; height: auto; }
  iframe[src*="youtube"], iframe[src*="youtu.be"] { aspect-ratio: 16 / 9; width: 100%; border: 0; }
  .yt-facade { position: relative; display: block; aspect-ratio: 16 / 9; width: 100%; background: #000; cursor: pointer; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  .yt-facade img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .yt-facade .yt-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); min-width: 68px; height: 48px; padding: 0 14px; border-radius: 12px; background: rgba(0,0,0,.75); color: #fff; font: 22px/48px sans-serif; text-align: center; }
  .yt-facade:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }
  .yt-facade iframe { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
<script>
(function () {
  var YT_SELECTOR = 'iframe[src*="youtube.com/embed/"], iframe[src*="youtube-nocookie.com/embed/"]';

  if (!document.querySelector('meta[name="viewport"]')) {
    var v = document.createElement('meta');
    v.name = 'viewport';
    v.content = 'width=device-width, initial-scale=1';
    document.head.appendChild(v);
  }

  function facade(f) {
    var m = f.src.match(/embed\/([\w-]{11})/);
    if (!m || f.closest('.yt-facade')) return;
    var id = m[1];
    var box = document.createElement('div');
    box.className = 'yt-facade';
    box.setAttribute('role', 'button');
    box.setAttribute('tabindex', '0');
    box.setAttribute('aria-label', 'Reproducir video');
    var img = document.createElement('img');
    img.src = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
    img.alt = '';
    img.loading = 'lazy';
    img.decoding = 'async';
    var play = document.createElement('span');
    play.className = 'yt-play';
    play.textContent = '▶';
    box.appendChild(img);
    box.appendChild(play);
    function load() {
      var ifr = document.createElement('iframe');
      ifr.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1';
      ifr.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
      ifr.allowFullscreen = true;
      box.innerHTML = '';
      box.appendChild(ifr);
      box.onclick = null;
      box.onkeydown = null;
    }
    box.onclick = load;
    box.onkeydown = function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); load(); }
    };
    f.replaceWith(box);
  }

  function swapYouTube(root) {
    if (root.matches && root.matches(YT_SELECTOR)) facade(root);
    root.querySelectorAll(YT_SELECTOR).forEach(facade);
  }

  // Intercepta el iframe al insertarse, antes de que el navegador empiece a cargarlo
  new MutationObserver(function (records) {
    records.forEach(function (r) {
      r.addedNodes.forEach(function (n) {
        if (n.nodeType === 1) swapYouTube(n);
      });
    });
  }).observe(document.documentElement, { childList: true, subtree: true });

  function setup() {
    document.querySelectorAll('img').forEach(function (img, i) {
      if (!img.hasAttribute('decoding')) img.decoding = 'async';
      if (i === 0) { img.fetchPriority = 'high'; img.loading = 'eager'; }
      else if (!img.hasAttribute('loading')) img.loading = 'lazy';
    });

    document.querySelectorAll('iframe').forEach(function (f) {
      if (!f.hasAttribute('loading')) f.loading = 'lazy';
    });

    swapYouTube(document);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setup);
  else setup();
})();
</script>
