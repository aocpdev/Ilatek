<script>
/* ILATEK perf v3 */
(function () {
  'use strict';

  var CDN = 'https://assets.cdn.filesafe.space/8OxUENFVM60EKzqsTcoD/media/';

  /* --- 0. Fallback de imágenes: nombre de archivo -> asset crudo del CDN de GHL.

  var RAW = {
    'svc-regular-800.webp': '6ab171ac825a8484f2dc1a14.jpg',

  window.IL_RAW = RAW;

      var name = String(el.currentSrc || el.getAttribute('src') || '').split('?')[0].split('/').pop();
      var raw = RAW[name];
      if (!raw) return;
      el.setAttribute('data-ilfb', '1');
      el.src = CDN + raw;

  }, true);

  /* --- 1. Preload del poster del hero (elemento LCP) sólo en el home. --- */
  try {
    var path = location.pathname;
    if (path === '/' || path === '' || path === '/index.html') {
      var pl = document.createElement('link');
      pl.rel = 'preload'; pl.as = 'image'; pl.fetchPriority = 'high';
      pl.href = 'https://cdn.jsdelivr.net/gh/aocpdev/Ilatek@main/assets/optimized/hero-poster-1280.webp';
      (document.head || document.documentElement).appendChild(pl);

  /* --- 2. Dedup de <video> duplicados EN VIVO (el builder de GHL mete su
     propio <video class="bgVideo"> con el mismo mp4). Se elimina durante el
     parseo, no en DOMContentLoaded (cuando ya se descargó dos veces). --- */
  var seen = {};
  function srcOf(v) {
    var src = v.getAttribute('src') || '';
    if (!src) { var s = v.querySelector('source'); src = s ? (s.getAttribute('src') || '') : ''; }
    return src.split('?')[0];
  }
  function killDup(v) {
    var src = srcOf(v);
    if (!src || src.indexOf('.mp4') < 0) return;
    if (!seen[src]) { seen[src] = v; return; }
    /* El parser inserta cada elemento por separado, asi que el MISMO video se
       escanea mas de una vez (una como parte de su seccion y otra el mismo).
       Sin este guard se auto-eliminaba el video del hero. */
    if (seen[src] === v) return;
    var keep = seen[src], cur = v;
    var curIsHero = (cur.className || '').indexOf('il-hero-video') > -1;
    var keepIsHero = (keep.className || '').indexOf('il-hero-video') > -1;
    if (curIsHero && !keepIsHero) {
      if (keep.parentNode) keep.parentNode.removeChild(keep);
      seen[src] = cur;
    } else {
      if (cur.parentNode) cur.parentNode.removeChild(cur);
    }
  }
  function scan(node) {
    if (!node || node.nodeType !== 1) return;
    if (node.tagName === 'VIDEO') { killDup(node); return; }
    if (node.querySelectorAll) {
      var vs = node.querySelectorAll('video');
      for (var i = 0; i < vs.length; i++) killDup(vs[i]);
    }
  }
  try {
    scan(document);
    var mo = new MutationObserver(function (muts) {
      for (var i = 0; i < muts.length; i++) {
        var added = muts[i].addedNodes;
        for (var j = 0; j < added.length; j++) scan(added[j]);
      }
    });
    mo.observe(document.documentElement, { childList: true, subtree: true });
    var stopMo = function () { mo.disconnect(); scan(document); };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', stopMo, { once: true });

  /* --- 3. Lazy below-fold media que GHL emite eager. Posicional: usa el
     innerHeight real de cada dispositivo (móvil, tablet, 4K). --- */
  function ilLazy() {
    try {
      var fold = window.innerHeight * 1.5;
      var els = document.querySelectorAll('img, iframe');
      for (var i = 0; i < els.length; i++) {
        var el = els[i];
        if (el.hasAttribute('loading')) continue;
        if (el.getAttribute('fetchpriority') === 'high') continue;
        if (el.getBoundingClientRect().top > fold) {
          el.setAttribute('loading', 'lazy');
          el.setAttribute('decoding', 'async');
        }
      }
    } catch (e) {}
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ilLazy, { once: true });
  else ilLazy();
})();

<!-- Performance head (GoHighLevel) -->
<link rel="dns-prefetch" href="https://www.googletagmanager.com">
<link rel="dns-prefetch" href="https://connect.facebook.net">
<link rel="dns-prefetch" href="https://i.ytimg.com">

<style>
  img, iframe, video { max-width: 100%; height: auto; }
  iframe[src*="youtube"], iframe[src*="youtu.be"] { aspect-ratio: 16 / 9; width: 100%; height: auto; border: 0; }
  .yt-facade { position: relative; display: block; aspect-ratio: 16 / 9; width: 100%; background: #000; cursor: pointer; overflow: hidden; }
  .yt-facade img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .yt-facade .yt-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 68px; height: 48px; border-radius: 12px; background: rgba(0,0,0,.75); color: #fff; font: 22px/48px sans-serif; text-align: center; }
  .yt-facade iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>

<script>
(function () {
  function init() {
    // Imágenes: la primera (posible LCP) con prioridad alta y sin lazy; el resto diferidas
    document.querySelectorAll('img').forEach(function (img, i) {
      if (!img.hasAttribute('decoding')) img.decoding = 'async';
      if (i === 0) { img.fetchPriority = 'high'; img.loading = 'eager'; }
      else if (!img.hasAttribute('loading')) img.loading = 'lazy';
    });

    // Iframes no críticos: diferidos
    document.querySelectorAll('iframe').forEach(function (f) {
      if (!f.hasAttribute('loading')) f.loading = 'lazy';
    });

    // YouTube: miniatura ligera; el reproductor carga solo al hacer clic
    document.querySelectorAll('iframe[src*="youtube.com/embed/"], iframe[src*="youtube-nocookie.com/embed/"]').forEach(function (f) {
      var m = f.src.match(/embed\/([\w-]{11})/);
      if (!m) return;
      var id = m[1];
      var box = document.createElement('div');
      box.className = 'yt-facade';
      box.setAttribute('role', 'button');
      box.setAttribute('tabindex', '0');
      box.setAttribute('aria-label', 'Reproducir video');
      var img = document.createElement('img');
      img.src = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      var play = document.createElement('span');
      play.className = 'yt-play';
      play.textContent = '▶';
      box.appendChild(img);
      box.appendChild(play);
      function load() {
        var ifr = document.createElement('iframe');
        ifr.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1';
        ifr.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        ifr.allowFullscreen = true;
        box.innerHTML = '';
        box.appendChild(ifr);
        box.onclick = null;
      }
      box.onclick = load;
      box.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); load(); } };
      f.replaceWith(box);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

<link rel="dns-prefetch" href="https://i.ytimg.com">

<style>
  img, video, iframe, embed, object { max-width: 100%; height: auto; }
  iframe[src*="youtube"], iframe[src*="youtu.be"] { aspect-ratio: 16 / 9; width: 100%; border: 0; }
  .yt-facade { position: relative; display: block; aspect-ratio: 16 / 9; width: 100%; background: #000; cursor: pointer; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  .yt-facade img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .yt-facade .yt-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); min-width: 68px; height: 48px; padding: 0 14px; border-radius: 12px; background: rgba(0,0,0,.75); color: #fff; font: 22px/48px sans-serif; text-align: center; }
  .yt-facade:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }
  .yt-facade iframe { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
<script>
(function () {
  var YT_SELECTOR = 'iframe[src*="youtube.com/embed/"], iframe[src*="youtube-nocookie.com/embed/"]';

  if (!document.querySelector('meta[name="viewport"]')) {
    var v = document.createElement('meta');
    v.name = 'viewport';
    v.content = 'width=device-width, initial-scale=1';
    document.head.appendChild(v);
  }

  function facade(f) {
    var m = f.src.match(/embed\/([\w-]{11})/);
    if (!m || f.closest('.yt-facade')) return;
    var id = m[1];
    var box = document.createElement('div');
    box.className = 'yt-facade';
    box.setAttribute('role', 'button');
    box.setAttribute('tabindex', '0');
    box.setAttribute('aria-label', 'Reproducir video');
    var img = document.createElement('img');
    img.src = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
    img.alt = '';
    img.loading = 'lazy';
    img.decoding = 'async';
    var play = document.createElement('span');
    play.className = 'yt-play';
    play.textContent = '▶';
    box.appendChild(img);
    box.appendChild(play);
    function load() {
      var ifr = document.createElement('iframe');
      ifr.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1';
      ifr.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
      ifr.allowFullscreen = true;
      box.innerHTML = '';
      box.appendChild(ifr);
      box.onclick = null;
      box.onkeydown = null;
    }
    box.onclick = load;
    box.onkeydown = function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); load(); }
    };
    f.replaceWith(box);
  }

  function swapYouTube(root) {
    if (root.matches && root.matches(YT_SELECTOR)) facade(root);
    root.querySelectorAll(YT_SELECTOR).forEach(facade);
  }

  // Intercepta el iframe al insertarse, antes de que el navegador empiece a cargarlo
  new MutationObserver(function (records) {
    records.forEach(function (r) {
      r.addedNodes.forEach(function (n) {
        if (n.nodeType === 1) swapYouTube(n);
      });
    });
  }).observe(document.documentElement, { childList: true, subtree: true });

  function setup() {
    document.querySelectorAll('img').forEach(function (img, i) {
      if (!img.hasAttribute('decoding')) img.decoding = 'async';
      if (i === 0) { img.fetchPriority = 'high'; img.loading = 'eager'; }
      else if (!img.hasAttribute('loading')) img.loading = 'lazy';
    });

    document.querySelectorAll('iframe').forEach(function (f) {
      if (!f.hasAttribute('loading')) f.loading = 'lazy';
    });

    swapYouTube(document);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setup);
  else setup();
})();
</script>
