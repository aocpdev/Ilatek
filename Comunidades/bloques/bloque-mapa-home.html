        leyenda.textContent='';
        leyenda.setAttribute('aria-label',t('Categorías de comunidades','Community categories'));
        LEYENDA.forEach(function(f){
          var li=document.createElement('li');
          var mark=document.createElement('span');mark.className='ilk-com__leyenda-e';mark.textContent=f.e;mark.setAttribute('aria-hidden','true');
          var texto=document.createElement('span');texto.textContent=t(f.es,f.en);
          li.appendChild(mark);li.appendChild(texto);
          leyenda.appendChild(li);
        });
      }
      renderLeyenda();
      var estadoMapa='cargando';
      /* El card abierto por hover queda FIJO en el mapa (no se cierra al
         apartar el cursor) hasta que se le despida: pasando a otro pin,
         clicando el mapa, la X del propio card o Escape. popActiva apunta
         al único popup abierto; activar() cambia de pin cerrando el
         anterior para que no se acumulen. */
      var popActiva=null;
      function activar(pop){
        if(popActiva&&popActiva!==pop&&popActiva.isOpen())popActiva.remove();
        if(!pop.isOpen())pop.addTo(mapa);
        popActiva=pop;
      }
      function cerrarCard(){
        if(popActiva&&popActiva.isOpen())popActiva.remove();
        popActiva=null;
      }

      function norm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
      function esEn(){return window.__ilatekLang==='en'}
      function t(es,en){return esEn()?en:es}
      /* La fila de regiones solo se desliza bajo el mismo breakpoint que el
         CSS usa para el overflow-x (640px): la pista de deslizar solo se
         pinta en ese medio. Mismo MQL que el <style> para que nunca se
         separen. */
      var MQL_MOVIL='(max-width:640px)';
      function esMovil(){return window.matchMedia(MQL_MOVIL).matches}
      function visible(com){
        if(region!=='todas'&&com.r!==region)return false;
        var q=norm(input&&input.value);
        if(!q)return true;
        return norm(com.n+' '+com.m).indexOf(q)>-1;
      }
      function urlDe(c){return vista==='limpieza'?c.v:c.u}
      function rotular(mk){
        var c=mk.dato;
        var svc=vista==='limpieza'?t('limpieza','cleaning'):t('sellado de techo','roof sealing');
        var acc=(esEn()?'Info of ':'Info de ')+svc+' — '+c.n+', '+c.m;
        mk.el.setAttribute('aria-label',acc);
        mk.el.title=acc;
      }
      /* Los popups ya abiertos se re-renderizan: «Seleccionar» apunta al
         servicio activo y los textos siguen el idioma en curso. */
      function refrescarAbiertas(){
        Object.keys(marcadores).forEach(function(k){
          var mk=marcadores[k];
          if(mk.pop&&mk.pop.isOpen())mk.pop.setDOMContent(domCom(mk.dato));
        });
      }
      function renderVistas(){
        vistas.forEach(function(btn){
          var esLimpieza=btn.getAttribute('data-vista')==='limpieza';
          var label=esLimpieza?t('Limpieza','Cleaning'):t('Sellado de Techo','Roof Sealing');
          var span=btn.querySelector('.ilk-com__vista-t');
          if(span)span.textContent=label;
          btn.setAttribute('aria-label',t('Ver comunidades con ','View communities with ')+(esLimpieza?t('limpieza','cleaning'):t('sellado de techo','roof sealing')));
        });
      }

      /* ---- Mini tutorial (paso a paso), primera carga de la sesion ---- */
      var TUTO='ilk-tuto-v1', tutoEl=null, tutoAbierto=false, tutoPaso=0;
      /* Media change con el tutorial abierto (rotacion, redimensionado): el
         paso activo se re-renderiza y la pista entra/sale junto al medio,
         sincronizada tambien con el idioma (renderTuto repasa t()). */
      try{window.matchMedia(MQL_MOVIL).addEventListener('change',function(){if(tutoAbierto)renderTuto()})}catch(e){}
      function pasosTuto(){
        return [
          {h:t('1 · Elige el servicio','1 · Pick the service'),p:t('Abajo a la izquierda alterna entre Sellado de Techo y Limpieza: el mapa muestra las comunidades del servicio activo.','Bottom-left, switch between Roof Sealing and Cleaning: the map shows the communities of the active service.')},
          {h:t('2 · Filtra o busca','2 · Filter or search'),p:t('Las pestañas de arriba limitan por región y el buscador encuentra tu comunidad por nombre o municipio.','The tabs above narrow it by region, and the search box finds your community by name or town.')+(esMovil()?' '+t('¿En móvil? Desliza la fila de regiones hacia los lados para verlas todas y toca la tuya.','On mobile, swipe the row of region tabs sideways to see them all, then tap yours.'):'')},
        ];
      }

      /* ---- Filtrado por region y busqueda: actua sobre los marcadores del mapa. ---- */
      function visibles(){
        var n=0;
        Object.keys(marcadores).forEach(function(key){
          var mk=marcadores[key];
          if(mk.el.style.display!=='none')n++;
        });
        return n;
      }
      function aplicar(){
        if(!mapa)return;
        /* Los marcadores se quedan en el mapa y se ocultan con display:none:
           quitarlos y volverlos a poner los reinicia. */
        COM.forEach(function(c){
          var mk=marcadores['c:'+c.u]; if(!mk)return;
          var fuera=!visible(c)||!urlDe(c);
          mk.el.style.display=fuera?'none':'';
        });
        pintarEstado();
      }

      chips.addEventListener('click',function(e){
        var btn=e.target.closest('.ilk-com__chip'); if(!btn)return;
        region=btn.getAttribute('data-region');
        chips.querySelectorAll('.ilk-com__chip').forEach(function(c){
          var on=c===btn;
          c.classList.toggle('is-active',on);
          c.setAttribute('aria-pressed',on?'true':'false');
        });
        aplicar();
      });
      if(input)input.addEventListener('input',aplicar);

      renderVistas();
      var vistasBox=root.querySelector('#ilk-com-vistas');
      if(vistasBox)vistasBox.addEventListener('click',function(e){
        var btn=e.target.closest('.ilk-com__vista'); if(!btn)return;
        vista=btn.getAttribute('data-vista');
        vistasBox.querySelectorAll('.ilk-com__vista').forEach(function(b){
          var on=b===btn;
          b.classList.toggle('is-active',on);
          b.setAttribute('aria-pressed',on?'true':'false');
        });
        if(mapa){
          Object.keys(marcadores).forEach(function(k){rotular(marcadores[k])});
          refrescarAbiertas();
        }
        pintarEstado();
      });

      /* Una sola pastilla de estado: carga, error y "sin coincidencias". */
      function pintarEstado(){
        if(estadoMapa==='error'){
          estado.textContent=t('Mapa no disponible. Recarga la página para intentarlo de nuevo.','Map unavailable. Reload the page to try again.');
          estado.hidden=false;
          return;
        }
        if(estadoMapa==='listo'){
          if(visibles()===0){
            estado.textContent=t('No encontramos esa comunidad. Prueba con el nombre del municipio.','We couldn’t find that community. Try the municipality name.');
            estado.hidden=false;
          }else{estado.hidden=true;}
          return;
        }
        estado.textContent=t('Cargando mapa…','Loading map…');
        estado.hidden=false;
      }
      function fallback(motivo){
        mapa=null;cargada=false;estadoMapa='error';
        pintarEstado();
        if(motivo)console.warn('[ilatek-mapa-comunidades]',motivo);
      }
      function cargarScript(src,onload,onerror){
        var s=document.createElement('script');
        s.src=src;s.async=true;s.crossOrigin='anonymous';
        s.integrity='sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj';
        s.onload=onload;s.onerror=onerror;document.head.appendChild(s);
      }
      function cargarCss(href){
        var l=document.createElement('link');
        l.rel='stylesheet';l.href=href;l.crossOrigin='anonymous';
        l.integrity='sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V';
        document.head.appendChild(l);
      }
      function puntoCom(c){
        var el=document.createElement('button');
        el.type='button';el.className='ilk-com__pin';
        el.innerHTML='<span class="ilk-com__pin-e" aria-hidden="true">'+(c.e||'🏠')+'</span>';
        return el;
      }

      /* ---- Info card del pin: imagen de la comunidad a la izquierda;
         a la derecha nombre, municipio, etiqueta Residencial/Apartamento
         y el botón «Seleccionar» que abre la landing del servicio activo.
         Se construye con nodos del DOM: ningún texto entra como HTML. */
      function domCom(c){
        var destino=vista==='limpieza'?(c.v||c.u):c.u;
        var frag=document.createDocumentFragment();
        var card=document.createElement('div');card.className='ilk-com__card';
        var img=document.createElement('img');img.className='ilk-com__card-img';
        img.src=c.img;img.alt=(c.e||'🏠')+' '+c.n+' — '+c.m;
        img.loading='lazy';img.decoding='async';
        /* Red de seguridad: si una foto por comunidad no está aún en el
           subdominio, cae a la imagen compartida sin romper el card. */
        img.onerror=function(){img.onerror=null;img.src=IMG_DEFAULT;};
        card.appendChild(img);
        var caja=document.createElement('div');caja.className='ilk-com__card-x';
        var nm=document.createElement('strong');nm.className='ilk-com__card-n';nm.textContent=c.n;caja.appendChild(nm);
        var mu=document.createElement('span');mu.className='ilk-com__card-m';mu.textContent=c.m;caja.appendChild(mu);
        var tip=document.createElement('span');tip.className='ilk-com__card-t';
        tip.textContent=c.e+' '+(c.e==='🏢'?t('Apartamento','Apartment'):t('Residencial','Residential'));
        caja.appendChild(tip);
        var cta=document.createElement('a');cta.className='ilk-com__card-cta';cta.href=destino;
        cta.textContent=t('Seleccionar','Select')+' '+t('›','›');
        caja.appendChild(cta);
        card.appendChild(caja);
        frag.appendChild(card);
        return frag;
      }
      /* Apertura del card: el hover lo muestra y lo DEJA FIJO — sin clic
         y sin cerrarse al apartar el cursor, para que la dueña elija con
         calma. El clic sigue alternando en táctil. El popup se gestiona
         aquí — ya no vía Marker.setPopup, cuyo toggle de clic competiría
         con el hover. Las vías de cierre viven en la inicialización del
         mapa (clic en el mapa, Escape) y la X propia del popup. */
      function flotarPin(el,pop){
        var hoverable=window.matchMedia&&window.matchMedia('(hover:hover)').matches;
        if(hoverable){
          el.addEventListener('mouseenter',function(){activar(pop)});
        }
        el.addEventListener('click',function(){
          if(popActiva===pop&&pop.isOpen()&&!hoverable)pop.remove();
          else activar(pop);
        });
      }
      function popupDe(c){
        var pop=new maplibregl.Popup({offset:16,closeButton:true,closeOnClick:false,maxWidth:'300px',className:'ilk-com__popup'}).setDOMContent(domCom(c));
        /* Posición propia: sin Marker.setPopup, el popup necesita sus
           coordenadas para estar en su sitio cuando el hover lo abra. */
        if(c.l!=null&&c.g!=null)pop.setLngLat([c.g,c.l]);
        /* Re-render al abrirse: el destino y los textos del card usan la
           vista de servicio y el idioma en curso, no los del momento en que
           se creó el marcador. */
        pop.on('open',function(){pop.setDOMContent(domCom(c))});
        /* La X propia del popup libera el estado de card fijo. */
        pop.on('close',function(){if(popActiva===pop)popActiva=null});
        return pop;
      }

      function iniciar(){
        if(!window.maplibregl){return fallback('maplibregl no cargo')}
        try{
          mapa=new maplibregl.Map({
            container:lienzo,
            style:ESTILO,
            center:[-66.45,18.15],zoom:7.1,
            attributionControl:{compact:true}
          });
          mapa.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
          mapa.scrollZoom.disable();
          /* Cierres del card fijo: clic en el mapa libre (no en pin ni en
             el propio card) y tecla Escape. */
          mapa.on('click',function(e){
            var n=e&&e.originalEvent&&e.originalEvent.target;
            if(n&&n.closest&&(n.closest('.ilk-com__popup')||n.closest('.maplibregl-marker')))return;
            cerrarCard();
          });
          document.addEventListener('keydown',function(e){if(e.key==='Escape')cerrarCard()});
          mapa.on('load',function(){
            cargada=true;estadoMapa='listo';
            COM.forEach(function(c){
              try{
                if(c.l==null||c.g==null)return;
                var el=puntoCom(c);
                /* El pin exacto es el verde de siempre; el aproximado y el
                   colocado en el municipio se pintan en variante tenue. */
                if(c.a!=='exacta')el.classList.add('is-aprox');
                var pop=popupDe(c);
                new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([c.g,c.l]).addTo(mapa);
                flotarPin(el,pop);
                marcadores['c:'+c.u]={el:el,dato:c,pop:pop};
                rotular(marcadores['c:'+c.u]);
              }catch(err){console.error('[ilatek-mapa-comunidades] comunidad',c&&c.n,err&&err.message)}
            });
            aplicar();
            /* Mini tutorial en la primera carga de la sesion. */
            setTimeout(iniciarTuto,700);
          });
          mapa.on('error',function(e){
            if(!cargada)fallback(e&&e.error?e.error.message:'error de mapa');
          });
        }catch(err){fallback(err&&err.message)}
      }

      function cargar(){
        if(cargada&&mapa)return;
        cargarCss(MAPLIBRE_CSS);
        cargarScript(MAPLIBRE_JS,iniciar,function(){fallback('no se pudo cargar maplibre-gl.js')});
        /* Guardián de arranque: si la descarga aborta a mitad (recarga de la
           página, red corta sin onerror), el estado quedaria clavado en
           "Cargando…" con el observador ya desconectado. Una sola via:
           marca error y re-probe una vez. */
        if(!vigilanteArmado){
          vigilanteArmado=true;
          setTimeout(function(){
            if(cargada||estadoMapa!=='cargando')return;
            fallback('arranque del mapa abortado');
            if(reintentos<2){reintentos++;armarLazy();}
          },12000);
        }
      }
      var vigilanteArmado=false, reintentos=0;
      function armarLazy(){
        if('IntersectionObserver' in window){
          obs=new IntersectionObserver(function(entries){
            if(entries.some(function(e){return e.isIntersecting})){obs.disconnect();cargar()}
          },{rootMargin:'250px'});
          obs.observe(contenedor);
        }else{cargar()}
      }

      /* El idioma del sitio puede cambiar en caliente: los popups y las
         etiquetas de los marcadores se reconstruyen con el texto activo. */
      window.addEventListener('ilatek:lang',function(){
        Object.keys(marcadores).forEach(function(k){rotular(marcadores[k])});
        refrescarAbiertas();
        renderVistas();
        renderLeyenda();
        renderTuto();
        pintarEstado();
      });

      function cerrarTuto(){
        tutoAbierto=false;
        if(tutoEl){tutoEl.remove();tutoEl=null}
        try{sessionStorage.setItem(TUTO,'1')}catch(e){}
      }
      function iniciarTuto(){
        if(tutoAbierto)return;
        try{if(sessionStorage.getItem(TUTO))return}catch(e){}
        tutoAbierto=true;tutoPaso=0;
        var card=document.createElement('div');
        card.className='ilk-com__tuto';
        card.setAttribute('role','dialog');
        card.setAttribute('aria-label',t('Cómo usar el mapa','How to use the map'));
        var cierra=document.createElement('button');
        cierra.type='button';cierra.className='ilk-com__tuto-x';
        cierra.setAttribute('aria-label',t('Cerrar tutorial','Close tutorial'));
        cierra.textContent='×';
        cierra.addEventListener('click',cerrarTuto);
        var caja=document.createElement('div'); caja.className='ilk-com__tuto-paso';
        var pie=document.createElement('div'); pie.className='ilk-com__tuto-pie';
        var contador=document.createElement('span'); contador.className='ilk-com__tuto-contador';
        var saltar=document.createElement('button'); saltar.type='button'; saltar.className='ilk-com__tuto-saltar';
        var prev=document.createElement('button'); prev.type='button'; prev.className='ilk-com__tuto-prev';
        var next=document.createElement('button'); next.type='button'; next.className='ilk-com__tuto-next';
        pie.appendChild(contador); pie.appendChild(saltar); pie.appendChild(prev); pie.appendChild(next);
        card.appendChild(cierra); card.appendChild(caja); card.appendChild(pie);
        contenedor.appendChild(card);
        tutoEl=card;
        prev.addEventListener('click',function(){if(tutoPaso>0){tutoPaso--;renderTuto()}});
        next.addEventListener('click',function(){
          if(tutoPaso>=pasosTuto().length-1){cerrarTuto()}else{tutoPaso++;renderTuto()}
        });
        saltar.addEventListener('click',cerrarTuto);
        renderTuto();
      }
      function renderTuto(){
        if(!tutoAbierto||!tutoEl)return;
        var pasos=pasosTuto(), p=pasos[tutoPaso];
        var caja=tutoEl.querySelector('.ilk-com__tuto-paso');
        caja.textContent='';
        var h=document.createElement('strong'); h.textContent=p.h;
        var d=document.createElement('span'); d.textContent=p.p;
        caja.appendChild(h); caja.appendChild(d);
        tutoEl.querySelector('.ilk-com__tuto-contador').textContent=(tutoPaso+1)+' / '+pasos.length;
        var prev=tutoEl.querySelector('.ilk-com__tuto-prev');
        var next=tutoEl.querySelector('.ilk-com__tuto-next');
        prev.hidden=tutoPaso===0;
        prev.textContent=t('Anterior','Back');
        next.textContent=tutoPaso===pasos.length-1?t('Entendido','Got it'):t('Siguiente','Next');
        tutoEl.querySelector('.ilk-com__tuto-saltar').textContent=t('Saltar','Skip');
      }

      var obs=null;
      armarLazy();
    })();
    </script>
  </section>
