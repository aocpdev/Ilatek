<!-- ILATEK · resolver global del puente dv-ghl-values + valores de marca.
     Sin gate: la página pinta de inmediato y los values se aplican en cuanto
     están disponibles (no se oculta nada, no se encola ningún handler).
     Canales, en orden de precedencia:
       1. párrafo nativo expandido por GHL (__SLOT_COUNT__ slots; acepta el viejo
          de __MIN_SLOT_COUNT__) o sus data-* ya expandidos;
          (en la raíz publicada GHL expande data-location-label con el pueblo,
          así que este canal ya trae valores reales sin párrafo);
       2. el pueblo que GHL SÍ expande server-side en <title>/og:title/
          og:description ("… en Juncos, Puerto Rico"): el título sale de
          {{custom_values.business__county_name}}, así que es el mismo custom
          value, sin depender de que el builder expanda el Custom Code;
       3. el subdominio del sitio (juncos.ilatekpr.com → Juncos);
       4. los valores de marca del contrato (custom-values.json → brand).
     El portador que viaja en el embed se oculta siempre (nunca es contenido).
     Estado en <html>: data-ilatek-values="ready" | "missing" (diagnóstico).
     El último slot es el pixel (Meta Pixel): un init y un PageView por carga,
     solo con id numérico; sin id válido no se carga ningún script de terceros. -->
<script>
(function(){
  if(window.ILATEK_BRIDGE)return;
  var SLOT=__SLOT_MAP__,MIN=__MIN_SLOT_COUNT__,FULL=__SLOT_COUNT__,PIXEL=__PIXEL_SLOT__,SEP='__SEPARATOR__';
  var BRAND=__BRAND__,TOWNS=__TOWN_ACCENTS__;
  var TOKEN=/\{\{\s*custom_values\.([a-z_]+)\s*\}\}/g;
  var COUNTY=SLOT.business__county_name;
  // Defensa por slot: última instancia cuando ningún canal trae el valor.
  var DEF=[],i;
  for(var k in BRAND){if(SLOT.hasOwnProperty(k))DEF[SLOT[k]]=String(BRAND[k]||'')}
  var ATTRS={};
  ATTRS['data-location-label']=COUNTY;
  ATTRS['data-primary-location']=COUNTY;
  ATTRS['data-website-url']=SLOT.website_url;
  ATTRS['data-business-email']=SLOT.business__email;
  ATTRS['data-business-phone']=SLOT.business__phone;
  ATTRS['data-facebook-url']=SLOT.facebook_url;
  ATTRS['data-instagram-url']=SLOT.instagram_url;
  var doc=document,root=doc.documentElement;
  var values=null,source='',state='',nodes=[],waiters=[],fired=false;
  // Diario del barrido con fallback: permite volver a resolver si el párrafo
  // llega después de haber pintado.
  var journal=[];

  function clean(v){v=String(v==null?'':v).replace(/\u00a0/g,' ').trim();return /\{\{/.test(v)?'':v}
  function list(sel){var out=[],n=doc.querySelectorAll(sel);for(var i=0;i<n.length;i++)out.push(n[i]);return out}

  // Párrafo completo > párrafo viejo (min_slots) > cualquier bloque hoja con el
  // separador (el builder nuevo no siempre expone el campo de clase). Un párrafo
  // con tokens crudos no cuenta: ese es el caso 'sin expandir'.
  function fromParagraph(){
    var ps=list('.dv-ghl-values,#dv-ghl-values'),old=null,i;
    for(i=0;i<ps.length;i++){
      var raw=String(ps[i].textContent||'');
      if(raw.indexOf('{{')>=0)continue;
      var parts=raw.split(SEP);
      if(parts.length>=FULL)return {values:parts,nodes:ps,source:'parrafo'};
      if(!old&&parts.length>=MIN)old={values:parts,nodes:ps,source:'parrafo'};
    }
    if(old)return old;
    var cand=doc.querySelectorAll('p,div,span'),best=null;
    for(i=0;i<cand.length;i++){
      var tx=String(cand[i].textContent||'');
      if(tx.indexOf(SEP)<0||tx.indexOf('{{')>=0)continue;
      if(tx.length>400)continue;
      var kids=cand[i].children,inner=false;
      for(var c=0;c<kids.length;c++){
        if(String(kids[c].textContent||'').indexOf(SEP)>=0){inner=true;break}
      }
      if(inner)continue;
      var pp=tx.split(SEP);
      if(pp.length>=FULL)return {values:pp,nodes:ps,source:'parrafo'};
      if(!best&&pp.length>=MIN)best={values:pp,nodes:ps,source:'parrafo'};
    }
    return best;
  }

  // Atributos data-* que GHL expandió (si expandió alguno).
  function fromData(){
    var found=null,count=0;
    for(var name in ATTRS){
      var idx=ATTRS[name];
      if(found&&found[idx])continue;
      var el=doc.querySelector('['+name+']');
      if(!el)continue;
      var v=clean(el.getAttribute(name));
      if(!v)continue;
      found=found||[];
      found[idx]=v;
      count++;
    }
    return found&&count?{values:found,nodes:[],source:'data'}:null;
  }

  // El pueblo que GHL expande en el <head>. Es el mismo custom value del título
  // de la página; sin párrafo nativo es el único canal que trae un valor real.
  function metaCounty(){
    var cands=[],els=['meta[property="og:title"]','meta[name="title"]','meta[property="og:description"]','meta[name="description"]'],e;
    if(doc.title)cands.push(doc.title);
    for(var i=0;i<els.length;i++){e=doc.querySelector(els[i]);if(e)cands.push(e.getAttribute('content')||'')}
    var re=/\ben\s+([A-Za-z\u00c0-\u00ff][^,<>|;]{1,40}?),\s*Puerto\s*Rico/;
    for(i=0;i<cands.length;i++){
      var m=re.exec(cands[i]||'');
      if(m){var t=clean(m[1].replace(/\s+/g,' '));if(t)return t}
    }
    return '';
  }

  // Último recurso sin tocar el builder: el pueblo está en el subdominio.
  function hostTown(){
    var host=String(location.hostname||'').toLowerCase();
    if(!host||/^\d+\.[\d.]+$/.test(host))return '';
    var labels=host.split('.');
    if(labels.length<3)return '';
    var sub=labels[0];
    if(!sub||sub==='www'||sub==='app')return '';
    if(TOWNS.hasOwnProperty(sub))return String(TOWNS[sub]);
    return sub.replace(/-/g,' ').replace(/(^|\s)([a-z\u00e0-\u00ff])/g,function(m,a,b){return a+b.toUpperCase()});
  }

  function read(){
    var got=fromParagraph();
    if(got)return got;
    var base=fromData();
    var vals=base?base.values.slice():[];
    var src=base?base.source:'';
    // El título manda sobre el data-*: un data-location-label horneado con el
    // literal genérico no debe pisar el pueblo que GHL expandió en el <head>.
    var mc=metaCounty();
    // Un data-* horneado con el literal genérico ("Puerto Rico") cuenta como
    // vacío: no debe impedir que el pueblo llegue por el subdominio.
    var dv=clean(vals[COUNTY]);
    if(mc){vals[COUNTY]=mc;src='meta'}
    else if(!dv||dv===DEF[COUNTY]){
      var ht=hostTown();
      if(ht){vals[COUNTY]=ht;src='host'}
    }

    if(!src)return null;
    return {values:vals,nodes:[],source:src};
  }

  // El párrafo manda: si un resolver corrió con título/data-*, el valor real se
  // sube en cuanto el párrafo aparece.
  function ensure(){
    if(values&&source==='parrafo')return values;
    var got=read();
    if(!got)return values;
    var vals=[];
    for(var i=0;i<FULL;i++)vals[i]=clean(got.values[i]);
    values=vals;
    nodes=got.nodes||[];
    source=got.source;
    return values;
  }

  function slot(i){var v=ensure();var x=v?clean(v[i]):'';return x||DEF[i]||''}

  function attr(v){
    return String(v==null?'':v).replace(TOKEN,function(m,n){
      if(!SLOT.hasOwnProperty(n))return m;
      var got=ensure(),i=SLOT[n],x=got?clean(got[i]):'';
      return x||DEF[i]||m;
    });
  }

  // Ningún token crudo visible: textos y atributos que ningún resolver tocó.
  function restore(){
    for(var i=journal.length-1;i>=0;i--){
      var j=journal[i];
      if(j.length===3)j[0].setAttribute(j[1],j[2]);
      else j[0].nodeValue=j[1];
    }
    journal=[];
  }

  function sweep(record){
    var v=values||[];
    // El portador no es contenido: si se barriera, el bridge leería su propio
    // reemplazo como si GHL lo hubiera expandido.
    var carriers=list('.dv-ghl-values,#dv-ghl-values');
    function rep(m,n){
      var i=SLOT.hasOwnProperty(n)?SLOT[n]:-1;
      return i<0?'':(clean(v[i])||DEF[i]||'');
    }
    var walker=doc.createTreeWalker(root,4,null,false),t,texts=[];
    while((t=walker.nextNode())){
      if(!t.nodeValue||t.nodeValue.indexOf('{{')<0)continue;
      var tag=t.parentNode&&t.parentNode.nodeName;
      if(tag==='SCRIPT'||tag==='STYLE')continue;
      if(carriers.indexOf(t.parentNode)>=0)continue;
      texts.push(t);
    }
    for(var i=0;i<texts.length;i++){
      if(record)journal.push([texts[i],texts[i].nodeValue]);
      texts[i].nodeValue=texts[i].nodeValue.replace(TOKEN,rep);
    }
    var els=root.querySelectorAll('*');
    for(i=0;i<els.length;i++){
      if(carriers.indexOf(els[i])>=0)continue;
      var at=els[i].attributes;
      for(var j=0;j<at.length;j++){
        if(!/^(href|src|alt|title|content|placeholder|aria-[a-z-]+|data-[a-z-]+)$/.test(at[j].name))continue;
        var val=at[j].value;
        if(!val||val.indexOf('{{')<0)continue;
        if(record)journal.push([els[i],at[j].name,val]);
        els[i].setAttribute(at[j].name,val.replace(TOKEN,rep));
      }
    }
  }

  // Rescate del texto que el generador del nav/tarjetas ya escribió con el
  // literal genérico antes de que hubiera values ('… en Puerto Rico'). Se limita
  // a los nodos del sistema i18n (data-es/data-en), donde ese patrón siempre es
  // el pueblo, y se corrige también el atributo para los cambios de idioma.
  function landed(){
    var c=slot(COUNTY);
    if(!c||c==='Puerto Rico')return;
    var re=/\ben\s+Puerto\s+Rico\b/g,rep='en '+c;
    var els=doc.querySelectorAll('[data-es],[data-en]');
    for(var i=0;i<els.length;i++){
      var el=els[i],at=el.attributes,j,n;
      for(j=0;j<at.length;j++){
        n=at[j];
        if(n.name!=='data-es'&&n.name!=='data-en')continue;
        if(n.value&&n.value.indexOf('en Puerto Rico')>=0)el.setAttribute(n.name,n.value.replace(re,rep));
      }
      var kids=el.childNodes;
      for(j=0;j<kids.length;j++){
        if(kids[j].nodeType===3&&kids[j].nodeValue&&kids[j].nodeValue.indexOf('en Puerto Rico')>=0){
          kids[j].nodeValue=kids[j].nodeValue.replace(re,rep);
        }
      }
    }
  }

  function pixel(){
    if(window.__ilatekPixel)return window.__ilatekPixel;
    // Se decide con la página ya cargada: si GHL enciende Meta por su cuenta
    // (funnel settings) se reutiliza ese fbq en vez de duplicar fbevents.js.
    if(doc.readyState!=='complete'){
      if(!window.__ilatekPixelWait){
        window.__ilatekPixelWait=1;
        window.addEventListener('load',function(){window.__ilatekPixelWait=0;pixel()},{once:true});
      }
      return '';
    }
    var v=ensure(),id=v?clean(v[PIXEL]):'';
    // Sin slot en el párrafo -> pixel de marca; con un id explícitamente
    // inválido en el párrafo -> no se carga Meta (no se adivina).
    if(!id)id=DEF[PIXEL]||'';
    if(!/^\d{6,20}$/.test(id)){
      if(!window.__ilatekPixelWarn){
        window.__ilatekPixelWarn=1;
        if(window.console&&console.warn)console.warn('[ILATEK] pixel_id inválido: Meta Pixel no se carga');
      }
      return '';
    }
    // GHL ya puede haber encendido Meta (funnel settings): no dupliques init ni
    // PageView. Si el id no está en la cola, se inicializa el nuestro.
    var q=window.fbq&&window.fbq.queue;
    var hasLoader=doc.querySelectorAll('script[src*="connect.facebook.net"]').length>0;
    if(q||hasLoader){
      var hasInit=false,hasPV=false,a;
      for(var i=0;i<q.length;i++){
        a=q[i];
        if(!a||!a.length)continue;
        if(a[0]==='init'&&String(a[1])===id)hasInit=true;
        if(a[0]==='track'&&a[1]==='PageView')hasPV=true;
      }
      window.__ilatekPixel=id;
      if(hasInit)return id;
      if(window.fbq){
        window.fbq('init',id);
        if(!hasPV)window.fbq('track','PageView');
      }
      return id;
    }
    window.__ilatekPixel=id;
    !function(f,b,e,url){if(f.fbq)return;var n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];var t=b.createElement(e);t.async=!0;t.src=url;var s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    window.fbq('init',id);window.fbq('track','PageView');
    return id;
  }

  // Resuelve una vez listo. Segunda llamada idempotente salvo subida a párrafo.
  function settle(){
    if(state==='ready'&&source==='parrafo')return true;
    if(!ensure())return false;
    if(journal.length)restore();
    sweep();
    landed();
    state='ready';
    root.setAttribute('data-ilatek-values','ready');
    if(!fired){
      fired=true;
      try{window.dispatchEvent(new CustomEvent('ilatek:values',{detail:{state:state,source:source,values:values}}))}catch(e){}
      try{var en=(doc.documentElement.lang||'es').toLowerCase().indexOf('en')===0;window.dispatchEvent(new CustomEvent('ilatek:lang',{detail:en?'en':'es'}))}catch(e){}
      var w=waiters;waiters=[];
      for(var i=0;i<w.length;i++){try{w[i](state)}catch(e){}}
    }
    pixel();
    return true;
  }

  function boot(){
    if(settle())return;
    state='missing';
    root.setAttribute('data-ilatek-values','missing');
    sweep(true); // fallback visible, sin tokens crudos; se deshace si el párrafo llega
    if(window.console&&console.warn)console.warn('[ILATEK] custom values: ni párrafo dv-ghl-values ni pueblo en el título/subdominio — la página sigue con fallback');
    // Los values pueden llegar después (GHL inyecta o expande tarde).
    var ticks=0;
    var poll=setInterval(function(){
      if(settle()||++ticks>80){clearInterval(poll);poll=null}
    },250);
    if(window.MutationObserver){
      var obs=new MutationObserver(function(){if(settle())obs.disconnect()});
      obs.observe(root,{childList:true,subtree:true,characterData:true});
    }
  }

  // El portador nunca es contenido: se oculta por CSS desde el primer paint.
  try{
    var st=doc.createElement('style');
    st.id='ilatek-values-carrier';
    st.textContent='.dv-ghl-values,#dv-ghl-values{display:none!important}';
    (doc.head||root).appendChild(st);
  }catch(e){}

  function start(){try{boot()}catch(e){}}
  if(doc.readyState==='loading')doc.addEventListener('DOMContentLoaded',start,{once:true});
  else start();

  window.ILATEK_BRIDGE={
    slot:slot,
    attr:attr,
    pixel:pixel,
    values:function(){return values?values.slice():[]},
    county:function(){return slot(COUNTY)},
    ready:function(cb){if(typeof cb!=='function')return;if(state==='ready')cb(state);else waiters.push(cb)},
    state:function(){return state},
    source:function(){return source},
    reason:function(){return state==='missing'?'sin párrafo, sin pueblo en el título y sin subdominio de pueblo':''}
  };
})();
</script>
